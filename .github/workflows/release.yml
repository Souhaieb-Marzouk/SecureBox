name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      # Requirement: fail the build if signing secrets are missing.
      - name: Require signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required repository secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Signing secrets are mandatory for a release. Refusing to publish an unsigned APK."
            exit 1
          fi

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/securebox-release.jks"
          chmod 600 "$RUNNER_TEMP/securebox-release.jks"
          test -s "$RUNNER_TEMP/securebox-release.jks"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Verify sources
        run: ./gradlew verifyNoHardcodedStrings testDebugUnitTest lintRelease --stacktrace

      - name: Build signed release APKs
        env:
          SECUREBOX_KEYSTORE_PATH: ${{ runner.temp }}/securebox-release.jks
          SECUREBOX_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SECUREBOX_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SECUREBOX_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Collect assets and checksums
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-universal-release.apk artifacts/securebox-universal-release.apk
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk artifacts/securebox-arm64-v8a-release.apk
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk artifacts/securebox-armeabi-v7a-release.apk
          cd artifacts
          sha256sum securebox-universal-release.apk securebox-arm64-v8a-release.apk securebox-armeabi-v7a-release.apk > SHA256SUMS
          cat SHA256SUMS

      - name: Verify signatures
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          for apk in artifacts/securebox-*.apk; do
            echo "== $apk"
            "$APKSIGNER" verify --print-certs "$apk"
          done

      - name: Prepare release title and body
        run: |
          set -euo pipefail
          NOTES="docs/releases/${GITHUB_REF_NAME}.md"
          if [ ! -f "$NOTES" ]; then
            echo "::error::Missing release notes file: $NOTES"
            exit 1
          fi
          head -n 1 "$NOTES" | sed 's/^# *//' > release-title.txt
          tail -n +2 "$NOTES" > release-body.md
          {
            echo ""
            echo "### Published SHA-256 hashes"
            echo ""
            echo "| File | SHA-256 |"
            echo "| --- | --- |"
            while read -r hash name; do
              echo "| \`$name\` | \`$hash\` |"
            done < artifacts/SHA256SUMS
            echo ""
            echo "Verify locally with \`sha256sum -c SHA256SUMS --ignore-missing\`."
          } >> release-body.md
          echo "Release title: $(cat release-title.txt)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: securebox-release
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$(cat release-title.txt)" \
            --notes-file release-body.md \
            artifacts/securebox-universal-release.apk \
            artifacts/securebox-arm64-v8a-release.apk \
            artifacts/securebox-armeabi-v7a-release.apk \
            artifacts/SHA256SUMS
