name: Sign threat feed

on:
  workflow_dispatch:
  push:
    paths:
      - "threat-intel/latest.json"

permissions:
  contents: write

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # A missing secret must not fail the workflow: maintainers can sign locally and commit the
      # .sig file. The check is done in a step output because `secrets` cannot be used in `if`.
      - name: Check signing key
        id: key
        env:
          THREAT_FEED_KEY: ${{ secrets.THREAT_FEED_KEY }}
        run: |
          if [ -n "$THREAT_FEED_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Threat feed signing skipped::THREAT_FEED_KEY is not configured; sign locally and commit latest.json.sig."
          fi

      - name: Write signing key
        if: steps.key.outputs.present == 'true'
        env:
          THREAT_FEED_KEY: ${{ secrets.THREAT_FEED_KEY }}
        run: printf '%s\n' "$THREAT_FEED_KEY" > "$RUNNER_TEMP/threat-feed.pem"

      - name: Sign latest.json
        if: steps.key.outputs.present == 'true'
        run: node tools/sign-release.mjs --file threat-intel/latest.json --key "$RUNNER_TEMP/threat-feed.pem"

      - name: Verify before committing
        if: steps.key.outputs.present == 'true'
        run: node tools/verify-release.mjs --file threat-intel/latest.json --sig threat-intel/latest.json.sig --key docs/threat-feed-public.pem

      - name: Commit signature
        if: steps.key.outputs.present == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: threat-intel/latest.json.sig
          commit_message: "chore(feed): sign latest.json"
