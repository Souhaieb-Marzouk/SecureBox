name: Signed APK Build

# Builds, signs and checksums the release APKs, then uploads them as workflow
# artifacts. Creating the GitHub Release is a manual step performed by the
# maintainer from the SecureBox-dist staging folder.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and sign release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub-hosted Ubuntu runners ship the Android SDK at $ANDROID_HOME.
      # The third-party setup-android action tries to install the retired "tools"
      # package and fails on current runner images, so we call sdkmanager directly.
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      # Requirement: fail the build if signing secrets are missing. An unsigned
      # artifact must never be uploaded.
      - name: Require signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required repository secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Signing secrets are mandatory. Refusing to upload an unsigned APK."
            exit 1
          fi

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/securebox-release.jks"
          chmod 600 "$RUNNER_TEMP/securebox-release.jks"
          test -s "$RUNNER_TEMP/securebox-release.jks"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Verify sources
        run: ./gradlew verifyNoHardcodedStrings testDebugUnitTest test lintRelease --stacktrace

      - name: Build signed release APKs
        env:
          SECUREBOX_KEYSTORE_PATH: ${{ runner.temp }}/securebox-release.jks
          SECUREBOX_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SECUREBOX_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SECUREBOX_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Collect assets and checksums
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-universal-release.apk artifacts/securebox-universal-release.apk
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk artifacts/securebox-arm64-v8a-release.apk
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk artifacts/securebox-armeabi-v7a-release.apk
          cd artifacts
          sha256sum securebox-universal-release.apk securebox-arm64-v8a-release.apk securebox-armeabi-v7a-release.apk > SHA256SUMS
          cat SHA256SUMS

      - name: Verify signatures
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          for apk in artifacts/securebox-*.apk; do
            echo "== $apk"
            "$APKSIGNER" verify --print-certs "$apk"
          done

      - name: Upload signed APKs
        uses: actions/upload-artifact@v4
        with:
          name: securebox-signed-${{ github.run_number }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Write job summary
        run: |
          {
            echo "## Signed APKs"
            echo ""
            echo '```'
            cat artifacts/SHA256SUMS
            echo '```'
            echo ""
            echo "Download this artifact and attach the files to the GitHub Release manually."
          } >> "$GITHUB_STEP_SUMMARY"
